# Signing identity for locally sideloaded builds.
#
# This keystore is committed on purpose: Android refuses to install an update
# whose signing certificate differs from the installed app, so every build -
# including the debug APKs produced by CI - must use the SAME key or each
# install demands "uninstall first" and destroys the Room user list, sessions
# and DataStore settings.
#
# It is a self-signed local key, not a Play Store upload key. Anyone with this
# repo can sign an update for this app, which is acceptable for a personal
# offline app and is the price of never needing to uninstall again.
storeFile=portal.jks
storePassword=hotspotportal
keyAlias=portal
keyPassword=hotspotportal
